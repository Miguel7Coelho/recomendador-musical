[project]
name = "spotify"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=43",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
