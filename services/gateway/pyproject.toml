[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "redis>=5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
