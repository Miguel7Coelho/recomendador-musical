name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check services
      - run: uvx ruff format --check services

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, separation, analysis, catalog, spotify]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - if: matrix.service == 'separation'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
