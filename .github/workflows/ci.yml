name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check services
      - run: uvx ruff format --check services

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, separation, analysis, catalog, spotify]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - if: matrix.service == 'separation'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q

  # SQL do catálogo e sessões do Spotify contra um Postgres de verdade com pgvector.
  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - working-directory: services/catalog
        run: uv sync --frozen --python 3.12 && uv run pytest -q tests/test_db.py
      - working-directory: services/spotify
        run: uv sync --frozen --python 3.12 && uv run pytest -q tests/test_sessions.py
